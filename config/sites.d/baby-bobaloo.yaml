# Reference fragment for the Baby Bobaloo production site.
# The canonical active registry remains config/sites.yaml.
- key: baby-bobaloo
  enabled: true
  kind: proxy
  hostnames:
    - babybobaloo.com
    - www.babybobaloo.com
  upstream: http://127.0.0.1:8081
  healthUrl: http://127.0.0.1:8081/api/health
  healthBodyContains: '"service":"baby-bobaloo"'
  expectedStatus: 200
  supabaseHeartbeat:
    enabled: true
    urlEnv: BABY_BOBALOO_SUPABASE_URL
    serviceRoleKeyEnv: BABY_BOBALOO_SUPABASE_SERVICE_ROLE_KEY
  publicHealthChecks:
    - url: https://babybobaloo.com/api/health
      expectedStatus: 200
      expectedBodyContains: '"service":"baby-bobaloo"'
    - url: https://www.babybobaloo.com/
      expectedStatus: 200
      expectedBodyContains: Baby Bobaloo
  notes: Baby Bobaloo Next.js storefront, deployed by the baby-bobaloo repo.
